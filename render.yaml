# Render Blueprint: New > Blueprint > pick this repo. Fill the prompted secrets. Free plan sleeps when idle.
services:
  - type: web
    name: concierge-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - { key: TENANT, value: chidama-tech }
      - { key: STORE, value: mongo }
      - { key: TRUST_PROXY, value: "true" }
      - { key: TRUSTED_PROXY_HOPS, value: "1" }   # Render adds one entry; raise to 2 only if you put Cloudflare in front
      - { key: DAILY_TURN_CAP, value: "600" }     # all visitors together; keep below your Groq free-tier daily limit
      - { key: ORCHESTRATOR, value: langgraph }
      - { key: GROQ_API_KEY, sync: false }
      - { key: MONGO_URI, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }     # your site URL, e.g. https://henry.vercel.app
      - { key: ADMIN_TOKEN, generateValue: true }
      - { key: LEAD_WEBHOOK_URL, sync: false }    # optional: LeadFlow
      - { key: LEAD_WEBHOOK_TOKEN, sync: false }
      - { key: NOTIFY_WEBHOOK_URL, sync: false }  # optional: Discord
