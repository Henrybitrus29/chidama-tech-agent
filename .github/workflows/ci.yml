name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (fake LLM, no network, no API key)
        run: python -m unittest discover -s tests -t . -v
      - name: Knowledge regression eval, brightside-solar
        run: python -m evals.run_eval --tenant brightside-solar --min-recall 0.85 --min-refusal 0.9
      - name: Knowledge regression eval, chidama-tech
        run: python -m evals.run_eval --tenant chidama-tech --min-recall 0.85 --min-refusal 0.9
      - name: Red-team harness, offline (worst-case model; fails if the tripwire or output sanitizing regresses)
        run: python -m evals.redteam --tenant chidama-tech
      - name: Docker image builds
        run: docker build -t concierge-agent .
