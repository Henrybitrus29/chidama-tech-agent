<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concierge widget demo</title>
<style>
  :root { --bg:#f6f7f3; --panel:#fff; --ink:#1b2420; --muted:#5b6761; --line:#d3dad5; --accent:#1f5f4a; --accent-ink:#fff; --user:#e6efe9; --err:#b3261e; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a17; --panel:#1b231f; --ink:#e9eeea; --muted:#9aa8a0; --line:#2f3a34; --accent:#5fb596; --accent-ink:#0d1511; --user:#26332c; --err:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  .demo { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem; }
  .demo h1 { font: 700 1.8rem/1.2 Georgia, serif; margin: 0 0 .5rem; }
  .demo p { color: var(--muted); }
  #cc-launch { position:fixed; right:1.25rem; bottom:1.25rem; padding:.8rem 1.2rem; border:0; border-radius:999px; background:var(--accent); color:var(--accent-ink); font:600 1rem system-ui; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  #cc-panel { position:fixed; right:1.25rem; bottom:4.75rem; width:min(24rem, calc(100vw - 2rem)); height:min(34rem, calc(100vh - 7rem)); display:none; flex-direction:column; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.25); }
  #cc-panel.open { display:flex; }
  .cc-head { padding:.75rem 1rem; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-weight:600; }
  .cc-head button { background:none; border:0; color:var(--muted); font:inherit; cursor:pointer; padding:.25rem .5rem; }
  #cc-log { flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:.75rem; }
  .msg { max-width:88%; padding:.6rem .8rem; border-radius:10px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.bot { background:transparent; border:1px solid var(--line); align-self:flex-start; }
  .msg.user { background:var(--user); align-self:flex-end; }
  .msg.err { color:var(--err); border-color:var(--err); }
  .src { margin-top:.5rem; font-size:.8rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:.4rem; }
  .chips { display:flex; flex-wrap:wrap; gap:.4rem; }
  .chips button { border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:999px; padding:.3rem .7rem; font:.85rem system-ui; cursor:pointer; }
  .banner { padding:.5rem 1rem; font-size:.85rem; background:var(--user); border-top:1px solid var(--line); }
  .cc-note { padding:.4rem 1rem 0; font-size:.75rem; color:var(--muted); }
  form { display:flex; gap:.5rem; padding:.75rem 1rem 1rem; }
  textarea { flex:1; resize:none; height:2.6rem; padding:.55rem .7rem; font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; }
  form button { padding:0 1rem; border:0; border-radius:8px; background:var(--accent); color:var(--accent-ink); font:600 .95rem system-ui; cursor:pointer; }
  form button:disabled { opacity:.55; cursor:wait; }
  button:focus-visible, textarea:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: no-preference) { .typing span { animation: blink 1.2s infinite; } .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s} }
  @keyframes blink { 50% { opacity:.2; } }
</style>
</head>
<body>
<div class="demo">
  <h1>Chat widget demo</h1>
  <p>This page stands in for a client's website. Open the chat in the corner. Set <code>API_URL</code> in the script below to your deployed backend.</p>
</div>

<button id="cc-launch" aria-expanded="false" aria-controls="cc-panel">Chat with us</button>
<section id="cc-panel" role="dialog" aria-label="Chat assistant">
  <div class="cc-head"><span id="cc-title">Assistant</span><button id="cc-close" aria-label="Close chat">Close</button></div>
  <div id="cc-log" role="log" aria-live="polite"></div>
  <div id="cc-banner" class="banner" hidden></div>
  <div class="cc-note" id="cc-privacy"></div>
  <form id="cc-form">
    <textarea id="cc-input" aria-label="Your message" maxlength="1000" placeholder="Type your question" required></textarea>
    <button type="submit">Send</button>
  </form>
</section>

<script>
(() => {
  const API_URL = 'https://YOUR-BACKEND.onrender.com';   // no trailing slash

  const $ = (id) => document.getElementById(id);
  const log = $('cc-log'), form = $('cc-form'), input = $('cc-input'), send = form.querySelector('button');
  let sessionId = null, config = null, busy = false;

  try { sessionId = sessionStorage.getItem('cc_session'); } catch (e) {}
  if (!sessionId) {
    const bytes = crypto.getRandomValues(new Uint8Array(18));
    sessionId = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
    try { sessionStorage.setItem('cc_session', sessionId); } catch (e) {}
  }

  function add(text, cls) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;                                   // never innerHTML: model output is untrusted
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function addSources(el, sources) {
    if (!sources || !sources.length) return;
    const box = document.createElement('div');
    box.className = 'src';
    box.textContent = 'Sources: ' + sources.map((s) => `[${s.n}] ${s.title} > ${s.heading}`).join('  ');
    el.appendChild(box);
  }

  function typing() {
    const el = document.createElement('div');
    el.className = 'msg bot typing';
    el.innerHTML = '<span>.</span><span>.</span><span>.</span>';   // static markup only
    el.setAttribute('aria-label', 'Assistant is typing');
    log.appendChild(el); log.scrollTop = log.scrollHeight;
    return el;
  }

  function chips(items) {
    if (!items || !items.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'chips';
    items.forEach((q) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = q;
      b.addEventListener('click', () => { wrap.remove(); ask(q); });
      wrap.appendChild(b);
    });
    log.appendChild(wrap);
  }

  async function loadConfig() {
    try {
      const r = await fetch(API_URL + '/api/config');
      config = await r.json();
      $('cc-title').textContent = config.assistant_name + ' - ' + config.business_name;
      $('cc-privacy').textContent = config.privacy_notice || '';
      add(config.welcome_message, 'bot');
      chips(config.suggested_questions);
    } catch (e) {
      add('The assistant is not reachable right now. Please try again later.', 'bot err');
    }
  }

  async function ask(text) {
    if (busy || !text.trim()) return;
    busy = true; send.disabled = true;
    add(text, 'user');
    const dots = typing();
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 60000);
    const slow = setTimeout(() => { dots.setAttribute('aria-label', 'Still working'); }, 8000);
    try {
      const res = await fetch(API_URL + '/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }), signal: ctrl.signal,
      });
      const data = await res.json().catch(() => ({}));
      dots.remove();
      if (res.status === 429) {
        const wait = res.headers.get('Retry-After') || '30';
        add(`You are sending messages quickly. Please wait ${wait} seconds and try again.`, 'bot err');
      } else if (!res.ok) {
        add(res.status === 503 ? 'The assistant is unavailable right now.' : 'Something went wrong. Please try again.', 'bot err');
      } else {
        addSources(add(data.answer, 'bot'), data.sources);
        if (data.escalated) { const b = $('cc-banner'); b.hidden = false; b.textContent = 'A team member has been notified and will follow up.'; }
      }
    } catch (e) {
      dots.remove();
      add(e.name === 'AbortError' ? 'The server took too long to respond. Please try again in a minute.' : 'Could not reach the server. Check your connection.', 'bot err');
    } finally {
      clearTimeout(timer); clearTimeout(slow); busy = false; send.disabled = false; input.focus();
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); const t = input.value; input.value = ''; ask(t); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

  const launch = $('cc-launch'), panel = $('cc-panel');
  function toggle(open) {
    panel.classList.toggle('open', open);
    launch.setAttribute('aria-expanded', String(open));
    if (open) { if (!config) loadConfig(); input.focus(); } else { launch.focus(); }
  }
  launch.addEventListener('click', () => toggle(!panel.classList.contains('open')));
  $('cc-close').addEventListener('click', () => toggle(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') toggle(false); });
})();
</script>
</body>
</html>
